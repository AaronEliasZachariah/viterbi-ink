<!doctype html>
<!--
  A REDIRECT STUB, not the policy. The real page lives at public/privacy.html and is served by the
  Cloudflare Worker at https://viterbi.eliascorp.org/privacy.

  It exists because this repo has two publishers. GitHub Pages is configured to serve branch `main`
  at path `/`, and the site moved under public/ so wrangler could take it as its assets directory —
  which left the Pages root with no HTML and every github.io path returning 404. That URL had
  already been handed out (the Play Console listing among other places), and a privacy policy that
  404s is the kind of dead link that gets a release rejected, so the old address forwards instead
  of dying. Deleting these stubs is fine once nothing points at github.io any more.
-->
